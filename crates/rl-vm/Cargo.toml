[package]
name = "rl-vm"
version = "1.0.0"
readme = "readme.md"
edition.workspace = true
license.workspace = true
description = "Bytecode virtual machine for the rl-lang programming language"
repository.workspace = true

[dependencies]
rl-ast.workspace = true
rl-checker.workspace = true
rl-lexer.workspace = true
rl-parser.workspace = true
rl-resolver.workspace = true
rl-utils.workspace = true
rl-std-core.workspace = true
rl-std = { workspace = true, features = ["impls"] }
zstd.workspace = true
# The OS-facing stdlib dependencies (eframe, rodio, libffi, crossterm, ...) now
# live in `rl-std` (pulled in transitively via its `impls` feature); the VM no
# longer depends on them directly.
