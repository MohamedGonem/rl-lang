[workspace]
resolver = "2"
members = [
    "crates/rl-utils",
    "crates/rl-lexer",
    "crates/rl-ast",
    "crates/rl-parser",
    "crates/rl-resolver",
    "crates/rl-vm",
    "crates/rl-cranelift",
    "crates/rl-interpreter",
    "crates/rl-checker",
    "crates/rl-docs",
    "crates/rl-tooling",
    "crates/rl-repl",
    "crates/rl-lsp",
    "crates/rl-cli",
    "crates/rl-commons",
    "crates/rl-std-core",
    "crates/rl-std-macros",
    "crates/rl-std",
    "crates/rl-tests",
    "crates/rl-benches",
]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rl-lang/rl-lang"

[workspace.dependencies]
rl-commons = { path = "crates/rl-commons" }
rl-std-core = { path = "crates/rl-std-core" }
rl-std-macros = { path = "crates/rl-std-macros" }
rl-std = { path = "crates/rl-std" }
rl-utils = { path = "crates/rl-utils" }
rl-lexer = { path = "crates/rl-lexer" }
rl-ast = { path = "crates/rl-ast" }
rl-parser = { path = "crates/rl-parser" }
rl-resolver = { path = "crates/rl-resolver" }
rl-vm = { path = "crates/rl-vm" }
rl-cranelift = { path = "crates/rl-cranelift" }
rl-interpreter = { path = "crates/rl-interpreter" }
rl-checker = { path = "crates/rl-checker" }
rl-docs = { path = "crates/rl-docs" }
rl-tooling = { path = "crates/rl-tooling" }
rl-repl = { path = "crates/rl-repl", default-features = false }
rl-lsp = { path = "crates/rl-lsp" }

criterion = { version = "0.5", features = ["html_reports"] }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
ariadne = "0.5"
crossterm = "0.28"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tiny_http = "0.12"
ureq = "2"
libloading = "0.8"
libffi = "5"
clap = { version = "4.6.1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
cranelift-jit = "0.116"
cranelift-module = "0.116"
cranelift-codegen = "0.116"
cranelift-frontend = "0.116"
target-lexicon = "0.13"
zstd = "0.13"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-all"] }
cpal = "0.17"
symphonia = { version = "0.5", features = ["all"] }
eframe = { version = "0.35", features = ["android-game-activity"] }
shell-words = "1.1"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Benchmarks should reflect the same optimisations as shipped releases,
# otherwise the numbers misrepresent the real binaries.
[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
