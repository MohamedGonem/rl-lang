name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse release for tags not on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} does not point to a commit on main - refusing to release"
            exit 1
          fi

  build:
    name: Build
    needs: verify
    uses: ./.github/workflows/_build.yml
    with:
      ref: ${{ github.ref }}
      build-profile: "release"
    permissions:
      contents: read

  publish:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: all-artifacts
          path: artifacts

      - name: Detect pre-release
        id: detect
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ steps.detect.outputs.value }}

  announce:
    name: Announce on Discord
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify release
        id: classify
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          CORE="${VERSION%%-*}"

          if [[ "$VERSION" == *-* ]]; then
            PRE="${VERSION#*-}"
            PRE_KIND=$(echo "$PRE" | cut -d. -f1 | tr '[:upper:]' '[:lower:]')
          else
            PRE=""
            PRE_KIND=""
          fi

          case "$PRE_KIND" in
            alpha)       LABEL="Alpha pre-release"; COLOR=15105570 ;;
            beta)        LABEL="Beta pre-release";  COLOR=15844367 ;;
            rc)          LABEL="Release candidate"; COLOR=3447003 ;;
            dev|nightly) LABEL="Dev build";          COLOR=9807270 ;;
            "")          LABEL=""; COLOR=3066993 ;;
            *)           LABEL="Pre-release ($PRE_KIND)"; COLOR=10181046 ;;
          esac

          PREV_TAG=$(git for-each-ref refs/tags --sort=-v:refname --format='%(refname:short)' \
            | grep -v "^${TAG}$" | head -n 1 || true)

          BUMP=""
          if [[ -n "$PREV_TAG" && "$PREV_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            PREV_CORE="${PREV_TAG#v}"; PREV_CORE="${PREV_CORE%%-*}"
            IFS='.' read -r CMAJ CMIN CPAT <<< "$CORE"
            IFS='.' read -r PMAJ PMIN PPAT <<< "$PREV_CORE"
            if   [[ "$CMAJ" != "$PMAJ" ]]; then BUMP="major"
            elif [[ "$CMIN" != "$PMIN" ]]; then BUMP="minor"
            elif [[ "$CPAT" != "$PPAT" ]]; then BUMP="patch"
            else BUMP="same"
            fi
          fi

          if [[ -z "$PRE_KIND" ]]; then
            case "$BUMP" in
              major) LABEL="Major release" ;;
              minor) LABEL="Minor release" ;;
              patch) LABEL="Patch release" ;;
              *)     LABEL="Stable release" ;;
            esac
            COLOR=3066993
          fi

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "label=$LABEL"
            echo "color=$COLOR"
            echo "bump=$BUMP"
            echo "prev_tag=$PREV_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Post to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_ANNOUNCEMENT_WEBHOOK }}
        run: |
          TAG="${{ steps.classify.outputs.tag }}"
          LABEL="${{ steps.classify.outputs.label }}"
          COLOR="${{ steps.classify.outputs.color }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"

          PAYLOAD=$(cat <<EOF
          {
            "embeds": [{
              "title": "$LABEL -- $TAG",
              "url": "$RELEASE_URL",
              "color": $COLOR,
              "description": "rl-lang $TAG is out. Check the release page for the changelog and prebuilt binaries.",
              "fields": [
                { "name": "Release", "value": "[$TAG]($RELEASE_URL)", "inline": true }
              ]
            }]
          }
          EOF
          )

          curl -sf -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK_URL"
