name: Nightly

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-changes:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Check if dev has changed since last nightly
        id: check
        run: |
          # Fetch the nightly tag
          git fetch origin nightly --tags 2>/dev/null || true

          NIGHTLY_SHA=$(git rev-parse nightly 2>/dev/null || echo "")
          DEV_SHA=$(git rev-parse dev)

          if [ "$NIGHTLY_SHA" = "$DEV_SHA" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Nightly tag already points to dev HEAD ($DEV_SHA). Skipping."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected: nightly=$NIGHTLY_SHA dev=$DEV_SHA"
          fi

  build:
    name: Build
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    uses: ./.github/workflows/_build.yml
    with:
      ref: dev
      build-profile: "nightly"
    permissions:
      contents: read

  publish:
    name: Publish Nightly
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Get the date for the release name
          DATE=$(date -u +%Y-%m-%d)

          # Find the previous nightly tag commit
          git fetch origin nightly --tags 2>/dev/null || true
          PREV_NIGHTLY_SHA=$(git rev-parse nightly 2>/dev/null || echo "")
          CURRENT_SHA=$(git rev-parse dev)

          if [ -n "$PREV_NIGHTLY_SHA" ] && [ "$PREV_NIGHTLY_SHA" != "$CURRENT_SHA" ]; then
            # Generate changelog from commits since last nightly
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "$PREV_NIGHTLY_SHA".."$CURRENT_SHA" --no-merges 2>/dev/null || echo "")
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" -20 --no-merges 2>/dev/null || echo "")
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No user-facing changes."
          fi

          # Write to file for multi-line output
          echo "$CHANGELOG" > /tmp/changelog.txt
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Force-update nightly tag
        run: |
          git tag -f nightly
          git push origin nightly --force

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: all-artifacts
          path: artifacts

      - name: Publish nightly release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: "Nightly Build (${{ steps.changelog.outputs.date }})"
          prerelease: true
          generate_release_notes: false
          body_path: /tmp/changelog.txt
          files: artifacts/*
