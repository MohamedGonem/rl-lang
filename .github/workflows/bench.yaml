name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      bench:
        description: Benchmark target(s) to run
        type: choice
        required: true
        default: all
        options:
          - all
          - lexer
          - parser
          - pipeline
          - vm
          - compare
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  bench:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Check release type
        id: release_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF_NAME#v}"
            CORE="${TAG%%-*}"
            PATCH="${CORE##*.}"
            if [ "$PATCH" = "0" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/checkout@v4
        if: steps.release_type.outputs.run == 'true'

      - name: Install ALSA dev headers
        if: steps.release_type.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        if: steps.release_type.outputs.run == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.release_type.outputs.run == 'true'

      - name: Select benchmark targets
        id: select
        if: steps.release_type.outputs.run == 'true'
        run: |
          target="${{ github.event.inputs.bench || 'all' }}"
          if [ "$target" = "all" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "args=--bench $target" >> "$GITHUB_OUTPUT"
          fi

      - name: Run benchmarks
        if: steps.release_type.outputs.run == 'true'
        run: |
          cargo bench -p rl-benches ${{ steps.select.outputs.args }}

      - name: Upload criterion report
        if: steps.release_type.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: criterion-report
          path: target/criterion
          if-no-files-found: error
